<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Pixeltech</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #0f172a;
    }
    .login-box p {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
    .login-box input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #2563eb;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <p>Pixeltech Dashboard</p>
    <form id="loginForm">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <a href="../index.html" class="back-link">← Back to Website</a>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Firebase Authentication will be connected later.\n\nFor now this is just the UI.');
    });
  </script>
</body>
</html>
